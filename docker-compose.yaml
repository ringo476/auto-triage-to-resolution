version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sentinel_pgvector
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: sentinel_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app  # Mounts local code for hot-reloading
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides the .env value so the app talks to the "db" service, not localhost.
      # Must keep the +asyncpg driver — the app's SQLAlchemy engine is async-only.
      - DATABASE_URL=postgresql+asyncpg://admin:admin_password@db:5432/sentinel_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: